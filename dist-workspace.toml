[workspace]
members = ["cargo:."]

# Config for 'dist' (https://github.com/axodotdev/cargo-dist).
#
# Pushing a `v*` tag runs .github/workflows/release.yml, which `dist generate`
# produces from this file. Do not edit that workflow by hand; change this
# file and run `dist generate` instead.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to. It must exist, and the release
# workflow needs a HOMEBREW_TAP_TOKEN secret with write access to it.
tap = "ari-becker/homebrew-commentlint"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]

# Build each target on a native runner: the tree-sitter grammars are C code
# and compile most reliably without a cross toolchain.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
