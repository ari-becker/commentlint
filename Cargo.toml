[package]
name = "commentlint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Static analysis for code comments, powered by TypeSafe.ai"
license = "MIT"
repository = "https://github.com/ari-becker/commentlint"
readme = "README.md"
include = ["src/**", "data/defaults.yaml", "Cargo.toml", "README.md", "LICENSE"]
keywords = ["lint", "comments", "static-analysis", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "commentlint"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"
ureq = { version = "3", features = ["json"] }

tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-cmake = "0.7"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-elm = "5.9"
tree-sitter-erlang = "0.20"
tree-sitter-fsharp = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-haskell = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-julia = "0.23"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.26"
tree-sitter-r = "1.3"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
